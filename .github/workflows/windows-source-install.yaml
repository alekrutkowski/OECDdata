name: Windows source installation

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      r_release:
        description: Exact R release used for current-version checks
        type: string
        default: release

permissions:
  contents: read

jobs:
  install:
    name: R ${{ matrix.config.r }} / ${{ matrix.config.arch }} / ${{ matrix.mode }}
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-2022, r: '4.2.3', arch: x86_64, legacy: false}
          - {os: windows-2022, r: '4.3.3', arch: x86_64, legacy: false}
          - {os: windows-2022, r: release, arch: x86_64, legacy: false}
          - {os: windows-11-arm, r: release, arch: arm64, legacy: false}
        mode: [normal, no-pkg-config]
        include:
          # Rtools40 provides extra libraries through its own package manager.
          # This lane does not assume that libxml2 is in its default installer.
          - config: {os: windows-2022, r: '4.1.3', arch: x86_64, legacy: true}
            mode: no-pkg-config
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      OECDDATA_LIVE_TESTS: 'false'
      OECD_WINDOWS_TEST_MODE: ${{ matrix.mode }}
      OECD_WINDOWS_TEST_ARCH: ${{ matrix.config.arch }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r == 'release' && inputs.r_release || matrix.config.r }}
          use-public-rspm: true
      - name: Install the legacy Rtools40 system library
        if: matrix.config.legacy
        shell: Rscript {0}
        run: |
          tool_root <- normalizePath(Sys.getenv("RTOOLS40_HOME", "C:/rtools40"),
            winslash = "/", mustWork = TRUE)
          shell <- file.path(tool_root, "usr/bin/bash.exe")
          stopifnot(file.exists(shell))
          status <- system2(shell, c("--noprofile", "--norc", "-c",
            shQuote("/usr/bin/pacman -Sy --needed --noconfirm mingw-w64-x86_64-libxml2")))
          stopifnot(identical(status, 0L),
            file.exists(file.path(tool_root, "mingw64/include/libxml2/libxml/parser.h")),
            file.exists(file.path(tool_root, "mingw64/lib/libxml2.a")))
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
      - name: Install from source with no custom include or linker flags
        run: Rscript tools/ci/windows-source-install.R install
      - name: Load and test the installed native package in a fresh R process
        run: Rscript tools/ci/windows-source-install.R verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-install-R-${{ matrix.config.r }}-${{ matrix.config.arch }}-${{ matrix.mode }}
          path: |
            .qa/windows-source-install.log
            .qa/windows-pkg-config-calls.log
            .qa/windows-source-session.txt
          include-hidden-files: true
          if-no-files-found: ignore
