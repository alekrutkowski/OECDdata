name: checktor
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      check_urls:
        description: Check live URLs as well as offline diagnostics
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  checktor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      OECDTEST_CHECKTOR_STRICT: '1'
      OECDTEST_CHECKTOR_URLS: ${{ github.event_name == 'workflow_dispatch' && inputs.check_urls && '1' || '0' }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install spelling backend
        run: sudo apt-get update && sudo apt-get install -y aspell aspell-en
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::checktor
          needs: check
      - name: Run every offline checktor category
        run: Rscript --vanilla tools/checktor.R .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checktor-results
          path: .qa/checktor
          include-hidden-files: true
          if-no-files-found: warn
